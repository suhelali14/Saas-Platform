<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nayaversse reel</title>
<!--
  A 30-second vertical reel, drawn as flat 2D motion graphics in the same
  world as nayaversse.in: a painted destination board above laminated chart
  panels in steel frames, ruled in red ink and stamped.

  Every frame is a pure function of time: render(t) sets every style from t
  and nothing accumulates between frames, so the capture script can render
  frame N on its own and get the same pixels every time.

  The story follows one patient, Priya, through a clinic morning:
    queue (she is pregnant, so she goes first) -> her antenatal visits side
    by side -> her prescription (repeat last, add one) -> her bill at the
    desk -> the clinic's own website, in her language -> brand.
  All names, numbers and the clinic are invented for the illustration.
-->
<style>
/*FONTS*/
:root{
  --steel:#161b20; --steel-deep:#0d1115; --steel-line:#313c45; --rivet:#55626c; --frame:#222a31;
  --board:#0a0c0d; --board-ink:#f6f2e9; --board-soft:#a7b0b6; --tile:#1a1f23;
  --chart:#f3ede1; --band:#e5dac4; --edge:#d6c9b0; --paper-hi:#fbf8f1;
  --rule:#a85f44; --rule-soft:#cfa894;
  --ink:#1a1917; --ink-soft:#4b4740; --ink-faint:#6b6459;
  --confirmed:#1a6340; --waiting:#845608; --priority:#a81f18; --stamp:#453585; --lamp:#eba63f;
  --brand:#db4a2b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--steel)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--steel);
  font-family:'IBM Plex Sans Variable','IBM Plex Sans Devanagari','Nirmala UI',sans-serif;color:var(--ink);
  font-variant-numeric:tabular-nums}
.a{position:absolute;left:0;top:0}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
.mono{font-family:'IBM Plex Mono','IBM Plex Sans Devanagari','Nirmala UI',monospace}

/* steel ground: two frame rails and rivets, so the void between panels is a
   built thing rather than an empty colour */
.rail{position:absolute;top:0;bottom:0;width:2px;background:var(--steel-line);opacity:.55}
.rivet{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--rivet);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.06)}

/* split-flap */
.flaprow{position:absolute;display:flex;gap:6px}
.cell{position:relative;background:var(--tile);border-radius:5px;display:flex;align-items:center;justify-content:center;
  color:var(--board-ink);font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--board)}
.cell span{display:block;line-height:1}

/* the board / strip */
#board{position:absolute;background:var(--board);overflow:hidden}

/* headline */
.hl{position:absolute;left:100px;top:388px;width:880px;color:var(--board-ink);
  font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;letter-spacing:.005em;text-transform:uppercase}
.hl .ln{height:98px;overflow:hidden}
.hl .ln span{display:block;font-size:100px;line-height:98px;white-space:nowrap}
.hl em{font-style:normal;color:var(--lamp)}
.hl .rule{position:absolute;left:0;height:5px;width:150px;background:var(--brand);transform-origin:left center}

.cap{position:absolute;left:100px;width:880px;color:var(--board-soft);font-size:23px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:500;white-space:nowrap}

/* the chart panel in its steel frame */
.panel{position:absolute;left:100px;width:880px;background:var(--chart);border-radius:4px;
  box-shadow:0 0 0 12px var(--frame),0 0 0 14px var(--steel-line),0 34px 60px -18px rgba(0,0,0,.75)}
.panel .pr{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--rivet);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.45)}
.ph{position:absolute;left:0;right:0;top:0;height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;
  border-bottom:2px solid var(--rule)}
.ph .t{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:46px;letter-spacing:.02em;text-transform:uppercase}
.ph .m{font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase}

.colh{position:absolute;left:0;right:0;height:52px;font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:.1em;color:var(--ink-faint);
  border-bottom:1px solid var(--rule)}
.colh span{position:absolute;top:16px}

.row{position:absolute;left:0;right:0;height:96px;border-bottom:1px solid var(--rule-soft)}
.row > *{position:absolute}
.tok{left:30px;top:26px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:36px}
.nm{left:132px;top:25px;font-size:36px;font-weight:500;white-space:nowrap}
.chip{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;letter-spacing:.06em;padding:6px 10px 5px;border:2px solid currentColor;border-radius:3px;white-space:nowrap}
.st{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;letter-spacing:.06em;white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:9px;vertical-align:1px}

.stampmark{position:absolute;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  border-radius:6px;padding:0 16px;line-height:1.08;mix-blend-mode:multiply;white-space:nowrap}

/* visits grid */
.vlab{position:absolute;left:30px;font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:.1em;color:var(--ink-faint)}
.vcol{position:absolute;top:92px;bottom:0;width:226px}
.vcol .vh{position:absolute;left:0;right:0;top:0;height:112px;padding:22px 18px 0;border-bottom:1px solid var(--rule)}
.vcol .vh .d{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:40px;line-height:1}
.vcol .vh .w{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--ink-faint);letter-spacing:.08em;margin-top:6px}
.vcol .vc{position:absolute;left:18px;right:12px;font-size:30px;line-height:1.12}
.vcol .vc.sm{font-size:24px;line-height:1.18}
.vsep{position:absolute;top:92px;bottom:0;width:1px;background:var(--rule-soft)}
.vrow{position:absolute;left:0;right:0;height:84px;border-bottom:1px solid var(--rule-soft)}
.sweep{position:absolute;left:176px;right:0;height:84px;background:rgba(235,166,63,.26);transform-origin:left center}

/* rx */
.btn{position:absolute;display:flex;align-items:center;gap:14px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:23px;letter-spacing:.06em;
  border:2px solid var(--ink);border-radius:4px;padding:0 22px;height:64px;color:var(--ink);background:var(--paper-hi)}
.field{position:absolute;left:30px;right:30px;height:70px;border:2px solid var(--ink-faint);border-radius:4px;background:var(--paper-hi);
  display:flex;align-items:center;padding:0 20px;gap:16px;font-size:30px}
.caret{display:inline-block;width:3px;height:36px;background:var(--ink);vertical-align:-6px;margin-left:2px}
.drop{position:absolute;left:30px;right:30px;background:var(--paper-hi);border:2px solid var(--ink-faint);border-top:none;border-radius:0 0 4px 4px;
  box-shadow:0 22px 40px -16px rgba(26,25,23,.45);transform-origin:top center;overflow:hidden}
.drop .it{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:28px;border-bottom:1px solid var(--edge);position:relative}
.drop .it .k{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--ink-faint);letter-spacing:.08em}
.drop .hi{position:absolute;inset:0;background:rgba(235,166,63,.32)}
.rx{position:absolute;left:0;right:0;height:92px;border-bottom:1px solid var(--rule-soft);padding:14px 30px 0}
.rx .n{font-size:32px;font-weight:500;white-space:nowrap}
.rx .s{font-family:'IBM Plex Mono',monospace;font-size:21px;color:var(--ink-soft);letter-spacing:.05em;margin-top:4px;text-transform:uppercase}
.rx .flash{position:absolute;inset:0;background:var(--lamp)}

/* bill */
.bl{position:absolute;left:0;right:0;height:84px;border-bottom:1px solid var(--rule-soft)}
.bl .l{position:absolute;left:30px;top:24px;font-size:32px}
.bl .r{position:absolute;right:30px;top:22px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px}
.tot{position:absolute;left:0;right:0;height:112px;border-top:3px double var(--rule)}
.pay{position:absolute;display:flex;gap:16px}
.pay .c{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:24px;letter-spacing:.08em;border:2px solid var(--ink);border-radius:4px;
  height:62px;width:150px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pay .c .f{position:absolute;inset:0;background:var(--ink)}
.pay .c b{position:relative;font-weight:600}

/* tap */
.tap{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:4px solid var(--ink)}
.tapdot{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(26,25,23,.28)}

/* phone */
.phone{position:absolute;left:250px;width:580px;background:var(--frame);border-radius:58px;padding:16px;
  box-shadow:0 0 0 2px var(--steel-line),0 34px 60px -18px rgba(0,0,0,.75)}
.screen{position:relative;width:100%;height:100%;background:var(--chart);border-radius:44px;overflow:hidden}
.url{position:absolute;left:24px;right:24px;top:22px;height:50px;border-radius:25px;background:var(--band);font-family:'IBM Plex Mono',monospace;
  font-size:20px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;letter-spacing:.04em}
.lang{display:inline-block;font-size:21px;padding:5px 11px;border:2px solid var(--edge);border-radius:4px;color:var(--ink-soft);position:relative;line-height:1.3}
.lang .lit{position:absolute;inset:-2px;background:var(--lamp);border-radius:4px}
.lang b{position:relative;font-weight:500}
.book{position:absolute;left:30px;right:30px;height:100px;border-radius:6px;background:var(--ink);color:var(--chart);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.book::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(243,237,225,.14)}
.book span{position:absolute;white-space:nowrap;font-weight:600;line-height:1.25}

/* end */
#sheet{position:absolute;left:0;top:0;width:1080px;height:1920px;background:var(--chart)}
#sheet .ruled{position:absolute;left:0;right:0;height:1px;background:var(--rule-soft);opacity:.55}
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
const W = 1080, H = 1920, FPS = 30, DUR = 30;
const stage = document.getElementById('stage');

/* ---------- small toolkit ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eOut = x => 1 - Math.pow(1 - x, 4);
const eExpo = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eInOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ePress = x => { const c1 = 2.1, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  (parent || stage).appendChild(e);
  return e;
}
const css = (e, o) => Object.assign(e.style, o);
const tf = (e, x = 0, y = 0, s = 1, r = 0) => { e.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`; };
const op = (e, v) => { e.style.opacity = v; };
const show = (e, on) => { e.style.visibility = on ? 'visible' : 'hidden'; };
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
function hash(a, b) {
  let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35);
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12;
  return h >>> 0;
}

/* sound events, read by the capture script and synthesised by sfx.py */
const SFX = [];
const sfx = (t, type, g = 1, extra = {}) => SFX.push({ t: +t.toFixed(3), type, g, ...extra });

/* ---------- split-flap ---------- */
const FLAP = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function flapRow(parent, n, cw, ch, fs, seed) {
  const row = el('div', 'flaprow', parent);
  const cells = [];
  for (let i = 0; i < n; i++) {
    const c = el('div', 'cell', row);
    css(c, { width: cw + 'px', height: ch + 'px', fontSize: fs + 'px' });
    const s = el('span', '', c);
    cells.push({ c, s });
  }
  return { row, cells, seed, width: n * cw + (n - 1) * 6 };
}
/* prev -> next, starting at `start`; each changed cell spins for `spin` s,
   staggered by `stag`. Unchanged cells do not flip, as on a real board. */
function flapPlan(fr, prev, next, start, stag, spin, gain = 1) {
  const plan = [];
  let k = 0;
  for (let i = 0; i < fr.cells.length; i++) {
    const a = prev[i] || ' ', b = next[i] || ' ';
    if (a === b) { plan.push(null); continue; }
    const s0 = start + k * stag, s1 = s0 + spin;
    plan.push([s0, s1]);
    sfx(s0, 'rattle', gain, { end: +s1.toFixed(3) });
    k++;
  }
  return { prev, next, plan };
}
function flapRender(fr, steps, t) {
  for (let i = 0; i < fr.cells.length; i++) {
    let ch = steps[0].prev[i] || ' ';
    let squash = 1;
    for (const st of steps) {
      const w = st.plan[i];
      if (!w) { if (t >= (st.at ?? -1)) ch = st.next[i] || ' '; continue; }
      if (t < w[0]) break;
      if (t >= w[1]) { ch = st.next[i] || ' '; continue; }
      const tick = Math.floor(t * 30);
      ch = FLAP[hash(i + fr.seed * 97, tick) % FLAP.length];
      squash = 0.78 + 0.22 * Math.abs(Math.cos((t * 30 % 1) * Math.PI));
      break;
    }
    const cell = fr.cells[i];
    if (cell.s.textContent !== ch) cell.s.textContent = ch === ' ' ? ' ' : ch;
    cell.s.style.transform = `scaleY(${squash})`;
  }
}

/* ---------- the steel ground ---------- */
el('div', 'rail', stage).style.left = '44px';
el('div', 'rail', stage).style.left = '1034px';
for (const y of [150, 1780]) for (const x of [38, 1028]) css(el('div', 'rivet', stage), { left: x + 'px', top: y + 'px' });

/* ---------- timeline ---------- */
const S = {
  queue: [3.2, 8.3],
  visits: [8.3, 12.7],
  rx: [12.7, 17.2],
  bill: [17.2, 21.5],
  web: [21.5, 25.75],
  end: [25.6, 30.0],
};

/* ---------- scene chrome: headline, panel, caption ---------- */
const scenes = [];
function scene(key, lines, caption, panelTop, panelH, opts = {}) {
  const root = el('div', 'a', stage);
  css(root, { width: W + 'px', height: H + 'px' });
  const hl = el('div', 'hl', root);
  const spans = lines.map(l => { const ln = el('div', 'ln', hl); return el('span', '', ln, l); });
  if (opts.hlSize) spans.forEach(s => css(s, { fontSize: opts.hlSize + 'px' }));
  const rule = el('div', 'rule', hl);
  rule.style.top = lines.length * 98 + 16 + 'px';
  let panel;
  if (opts.phone) {
    panel = el('div', 'phone', root);
    css(panel, { top: panelTop + 'px', height: panelH + 'px' });
  } else {
    panel = el('div', 'panel', root);
    css(panel, { top: panelTop + 'px', height: panelH + 'px' });
    for (const [x, y] of [[-8, -8], [870, -8], [-8, panelH - 2], [870, panelH - 2]]) css(el('div', 'pr', panel), { left: x + 2 + 'px', top: y + 'px' });
  }
  const cap = el('div', 'cap mono', root, caption);
  cap.style.top = panelTop + panelH + 50 + 'px';
  const sc = { key, win: S[key], root, hl, spans, rule, panel, cap };
  scenes.push(sc);
  sfx(S[key][0] + 0.04, 'slide', 0.8);
  return sc;
}
function chrome(sc, t) {
  const [a, b] = sc.win;
  const on = t >= a - 0.02 && t <= b + 0.02;
  sc.root.style.display = on ? '' : 'none';
  if (!on) return false;
  const ein = eExpo(p(t, a, a + 0.8)), fin = p(t, a, a + 0.2);
  const ex = eInOut(p(t, b - 0.42, b));
  tf(sc.panel, 0, lerp(190, 0, ein) - 80 * ex);
  op(sc.panel, fin * (1 - ex));
  sc.spans.forEach((s, i) => {
    const u = eExpo(p(t, a + 0.06 + i * 0.1, a + 0.75 + i * 0.1));
    tf(s, 0, (1 - u) * 104);
  });
  tf(sc.hl, 0, -36 * ex);
  op(sc.hl, 1 - ex);
  sc.rule.style.transform = `scaleX(${eExpo(p(t, a + 0.3, a + 1.0))})`;
  const cu = eOut(p(t, a + 0.45, a + 0.95));
  tf(sc.cap, 0, (1 - cu) * 14);
  op(sc.cap, cu * (1 - ex));
  return true;
}
function tap(parent, x, y, t0) {
  const ring = el('div', 'tap', parent), dot = el('div', 'tapdot', parent);
  css(ring, { left: x + 'px', top: y + 'px' }); css(dot, { left: x + 'px', top: y + 'px' });
  sfx(t0, 'tap', 0.9);
  return t => {
    const u = p(t, t0 - 0.12, t0 + 0.38);
    const vis = t > t0 - 0.12 && t < t0 + 0.38;
    show(ring, vis); show(dot, vis);
    if (!vis) return;
    const g = eOut(p(t, t0, t0 + 0.38));
    tf(ring, 0, 0, lerp(0.55, 1.5, g)); op(ring, t < t0 ? p(t, t0 - 0.12, t0) * 0.7 : 0.7 * (1 - g));
    tf(dot, 0, 0, t < t0 ? lerp(1.4, 1, p(t, t0 - 0.12, t0)) : 1); op(dot, t < t0 ? p(t, t0 - 0.12, t0) : 1 - g);
  };
}
function stampMark(parent, text, color, size, x, y, rot, t0, kind = 'stamp', liftAt = null) {
  const s = el('div', 'stampmark', parent, text);
  css(s, { color, border: `${Math.round(size / 15)}px solid ${color}`, fontSize: size + 'px', left: x + 'px', top: y + 'px' });
  sfx(t0 + 0.12, kind, 1);
  return t => {
    const u = p(t, t0, t0 + 0.24);
    show(s, t >= t0);
    if (t < t0) return;
    // a stamp that has done its job lifts off, so the status under it reads
    const lift = liftAt == null ? 0 : eOut(p(t, liftAt, liftAt + 0.3));
    tf(s, 0, -26 * lift, lerp(1.9, 1, ePress(u)) * (1 + 0.12 * lift), rot);
    op(s, Math.min(1, u * 2.6) * 0.9 * (1 - lift));
  };
}

/* ================= HOOK + BOARD/STRIP ================= */
const board = el('div', '', stage); board.id = 'board';
const hookMeta = el('div', 'a mono', board, 'MON&nbsp;&nbsp;·&nbsp;&nbsp;10:38 AM&nbsp;&nbsp;·&nbsp;&nbsp;OPD');
css(hookMeta, { left: '0', width: W + 'px', top: '640px', textAlign: 'center', color: 'var(--board-soft)', fontSize: '28px', letterSpacing: '.14em' });
const L1 = '38 WAITING.', L2 = "WHO'S NEXT?";
const hook1 = flapRow(board, 11, 80, 136, 124, 3), hook2 = flapRow(board, 11, 80, 136, 124, 7);
css(hook1.row, { left: (W - hook1.width) / 2 + 'px', top: '728px' });
css(hook2.row, { left: (W - hook2.width) / 2 + 'px', top: '884px' });
hook2.cells.forEach(c => (c.s.style.color = 'var(--lamp)'));
const hookSteps1 = [flapPlan(hook1, '           ', L1, 0.3, 0.05, 0.42)];
const hookSteps2 = [flapPlan(hook2, '           ', L2, 1.05, 0.05, 0.42)];
const hookBar = el('div', 'a', board);
css(hookBar, { left: '470px', top: '1072px', width: '140px', height: '5px', background: 'var(--brand)', transformOrigin: 'center' });

/* strip contents: wordmark left, live lamp + clock right */
const strip = el('div', 'a', board);
const mark = el('img', 'a', strip); mark.src = '{{IMG:wordmark}}';
css(mark, { left: '36px', top: '31px', height: '38px' });
const lampDot = el('div', 'a', strip);
css(lampDot, { left: '640px', top: '44px', width: '12px', height: '12px', borderRadius: '50%', background: 'var(--lamp)' });
const lampLab = el('div', 'a mono', strip, 'OPD 1');
css(lampLab, { whiteSpace: 'nowrap', left: '662px', top: '36px', color: 'var(--board-soft)', fontSize: '22px', letterSpacing: '.12em' });
const clock = flapRow(strip, 5, 44, 64, 50, 11);
css(clock.row, { left: 1000 - 36 - clock.width + 'px', top: '18px' });
const CLOCKS = [['queue', '10:40'], ['visits', '10:46'], ['rx', '10:52'], ['bill', '10:58'], ['web', '11:10']];
const clockSteps = [];
{
  let prev = '10:38';
  const first = { prev, next: prev, plan: [null, null, null, null, null] };
  clockSteps.push(first);
  for (const [k, v] of CLOCKS) {
    const st = flapPlan(clock, prev, v, S[k][0] + 0.15, 0.06, 0.32, 0.55);
    clockSteps.push(st);
    prev = v;
  }
}
const BOARD_FULL = { x: 0, y: 0, w: W, h: H, r: 0 };
