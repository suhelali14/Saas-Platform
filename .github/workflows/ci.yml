name: CI

# Runs on every push and PR. The deploy workflows wait on this, so a
# broken typecheck never reaches a clinic.
on:
  push:
    branches: [main, master]
  pull_request:
  # Deploy workflows call this so there is exactly one definition of
  # "is this build good", rather than two that can drift apart.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Each API's postinstall runs `prisma generate`, so the clients are
      # built here. Note `prisma` is a devDependency, so --omit=dev would
      # make this install fail rather than merely skip the generate.
      - name: Install
        run: npm ci

      # Belt and braces: if a postinstall is ever removed, this fails with
      # the app's name rather than as a wall of type errors about models
      # that "do not exist".
      - name: Generate Prisma clients
        run: |
          for app in clinic-api provider-api; do
            echo "--- $app ---"
            ( cd "apps/$app" && npx prisma generate )
          done

      - name: Typecheck
        run: |
          for app in clinic-api provider-api; do
            echo "--- $app ---"
            ( cd "apps/$app" && npx tsc --noEmit )
          done
          for app in clinic-web provider-console; do
            echo "--- $app ---"
            ( cd "apps/$app" && npx tsc -b )
          done

      # Subdomain routing, the CORS origin check and slug validation all
      # fail OPEN if they regress: a wrong hostname match would point one
      # clinic's staff at another clinic's database. Cheap to run, so it
      # gates every deploy.
      - name: Subdomain and origin tests
        run: bash scripts/subdomain-tests/run.sh

      # The image build is the slowest thing in the pipeline, and the two
      # ways it fails are both static: a COPY source that does not exist,
      # and a workspace manifest that never reaches the context (npm ci
      # then fails on the lockfile). Both are caught here in a second
      # instead of five minutes into a build.
      - name: Check the Dockerfile against the build context
        run: python3 scripts/check-dockerfile.py

      - name: Build everything
        run: |
          for app in clinic-api provider-api clinic-web provider-console; do
            echo "--- building $app ---"
            npm run --workspace "apps/$app" build
          done

      # A build that is clean but accidentally bundles a secret is worse
      # than a failing one, because it ships.
      # A production bundle is public: anything in it is readable by
      # anyone who opens the site. This looks for the SHAPES credentials
      # take, not for their variable names -- the first version matched
      # the name and failed the build when the console displayed
      # "NEON_API_KEY is not set" in a warning telling the operator what
      # to configure. A check that fires on documentation gets ignored.
      - name: Check no secret values in the frontend bundles
        run: |
          fail=0

          # Provider token prefixes, a Postgres URL carrying a password,
          # and a PEM private key. Each is a value, never a label.
          patterns='
            napi_[A-Za-z0-9]{24,}
            vcp_[A-Za-z0-9]{24,}
            (ghp|gho|ghs|ghu)_[A-Za-z0-9]{30,}
            github_pat_[A-Za-z0-9_]{30,}
            postgres(ql)?://[^:/@[:space:]]+:[^@[:space:]]+@
            # No spaces in these patterns: the loop below word-splits
            # on whitespace, so a pattern containing one is silently torn
            # into fragments that match the wrong things.
            -----BEGIN.{0,24}PRIVATE
          '

          for dir in apps/clinic-web/dist apps/provider-console/dist; do
            [ -d "$dir" ] || continue
            for pattern in $patterns; do
              if grep -rqE "$pattern" "$dir" 2>/dev/null; then
                echo "::error::A credential matching /$pattern/ is present in $dir"
                # Show only where, never the value itself -- a CI log is
                # retained and often shared.
                grep -rlE "$pattern" "$dir" | sed 's/^/  /'
                fail=1
              fi
            done

            # An inlined secret also looks like NAME=value. The name
            # alone is fine; the name followed by something substantial
            # is not.
            for name in JWT_SECRET NEON_API_KEY VERCEL_TOKEN DATABASE_URL; do
              if grep -rqE "$name[\"']?[:=][\"']?[A-Za-z0-9+/_-]{16,}" "$dir" 2>/dev/null; then
                echo "::error::$name appears with a value attached in $dir"
                fail=1
              fi
            done
          done

          [ "$fail" = "0" ] && echo "clean: no credential values in either bundle"
          exit $fail
