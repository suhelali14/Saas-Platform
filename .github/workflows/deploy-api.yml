name: Deploy APIs

# Build an image once, push it, then deploy that exact image.
#
#   CI green -> build -> push to ghcr.io -> SSH -> pull, migrate, restart
#
# Nothing is compiled on the server. What runs in production is the
# artifact that passed the tests, not a second build from the same source
# that could differ because a dependency moved or the box has a different
# toolchain.
#
# The registry is GitHub's own: container storage and bandwidth are free,
# and it authenticates with the token this workflow already has, so there
# is no extra account and no extra secret.

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/clinic-api/**'
      - 'apps/provider-api/**'
      - 'packages/**'
      - 'package-lock.json'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing image tag to deploy (skips the build). Leave blank to build this commit.'
        required: false
        default: ''

concurrency:
  # Queued, never cancelled: two deploys at once would fight over the same
  # databases and the same compose file. A half-finished deploy is worse
  # than a slow one.
  group: deploy-api
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Lowercased below -- ghcr rejects uppercase in a repository name, and
  # GitHub owners often have capitals.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    # Skipped when redeploying an already-built tag: it was tested then.
    if: github.event.inputs.tag == ''
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    if: github.event.inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image name
        id: meta
        run: |
          repo="$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/$repo/api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Only needed to build for an architecture the runner is not. The
      # runner is amd64, so an ARM target (Oracle's free Ampere
      # instances, an AWS Graviton box) is emulated through QEMU.
      - name: Set up QEMU
        if: contains(vars.IMAGE_PLATFORMS, 'arm')
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided automatically; `packages: write` above is what makes
          # it able to push.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          # Which CPU the server runs. Defaults to amd64, which covers
          # DigitalOcean, Hetzner, Railway and Render. Set the repo
          # variable IMAGE_PLATFORMS to linux/arm64 for an ARM host such
          # as Oracle's Always Free Ampere instances -- an amd64 image
          # simply will not start there, with an exec format error that
          # does not mention architecture.
          #
          # Emulated ARM builds take roughly 3x longer, so build only the
          # architecture you actually deploy to rather than both.
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          # Immutable SHA tag is what gets deployed, so a rollback names
          # an exact artifact. `latest` is a convenience for humans and is
          # never what the deploy step uses.
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/api:latest
          # Layer cache in the registry, so an unchanged dependency tree
          # is not reinstalled on every push.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/api:buildcache,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "### Image built" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    # Runs when the build ran, or when redeploying a given tag.
    if: always() && (needs.build.result == 'success' || github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Checks the SHAPE of each secret, not just that something is set.
      # A placeholder like "23" for a host passes a presence check and then
      # fails inside ssh with a timeout that names nothing -- and the
      # values are secrets, so you cannot look at them to see why.
      # Nothing here echoes a value, only what is wrong with it.
      - name: Check the server secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.DEPLOY_HOST_KEY }}
          # Same names read as VARIABLES. Secrets and variables are two
          # separate tabs on the same settings page, and the Variables
          # one shows its values while Secrets does not -- so being able
          # to read your value back is itself the symptom of putting it
          # in the wrong tab. Detected here because "DEPLOY_HOST is not
          # set" sends you to re-add something you already added.
          VAR_HOST: ${{ vars.DEPLOY_HOST }}
          VAR_USER: ${{ vars.DEPLOY_USER }}
          VAR_KEY: ${{ vars.DEPLOY_SSH_KEY }}
          VAR_HOSTKEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          bad=0
          complain() { echo "::error::$1"; bad=1; }

          wrong_tab=""
          [ -z "$HOST" ] && [ -n "$VAR_HOST" ] && wrong_tab="$wrong_tab DEPLOY_HOST"
          [ -z "$USER" ] && [ -n "$VAR_USER" ] && wrong_tab="$wrong_tab DEPLOY_USER"
          [ -z "$KEY" ] && [ -n "$VAR_KEY" ] && wrong_tab="$wrong_tab DEPLOY_SSH_KEY"
          [ -z "$HOSTKEY" ] && [ -n "$VAR_HOSTKEY" ] && wrong_tab="$wrong_tab DEPLOY_HOST_KEY"
          if [ -n "$wrong_tab" ]; then
            echo "::error::These are set as repository VARIABLES but are read as SECRETS:$wrong_tab"
            echo "::error::Settings > Secrets and variables > Actions > the SECRETS tab (not Variables). Delete the variables afterwards -- DEPLOY_SSH_KEY as a variable is a private key stored in the clear."
            {
              echo "### Wrong tab"
              echo ""
              echo "Found in **Variables**, needed in **Secrets**:\`$wrong_tab\`"
              echo ""
              echo "Variables are for public values and show their contents."
              echo "A private key must be a Secret."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -z "$HOST" ]; then
            complain "DEPLOY_HOST is not set. It is your droplet's IP."
          elif ! printf '%s' "$HOST" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}$|^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9-]+)+$'; then
            complain "DEPLOY_HOST does not look like an IP address or a hostname. Use the droplet's IPv4 address from digitalocean.com > Droplets."
          fi

          if [ -z "$USER" ]; then
            complain "DEPLOY_USER is not set. It should be: deploy"
          elif [ "$USER" != "deploy" ]; then
            echo "::warning::DEPLOY_USER is not 'deploy'. That is the user bootstrap-server.sh creates, so this is probably wrong."
          fi

          if [ -z "$KEY" ]; then
            complain "DEPLOY_SSH_KEY is not set. Generate it with: ssh-keygen -t ed25519 -f ~/.ssh/clinic-deploy -N ''"
          elif printf '%s' "$KEY" | grep -qE '^(ssh-(rsa|ed25519|dss)|ecdsa-sha2)'; then
            complain "DEPLOY_SSH_KEY holds the PUBLIC key. It needs the private half -- the file WITHOUT .pub, which starts with '-----BEGIN'. The .pub half belongs on the server instead."
          elif ! printf '%s' "$KEY" | grep -q 'BEGIN .*PRIVATE KEY'; then
            complain "DEPLOY_SSH_KEY is not a private key. Paste the whole of ~/.ssh/clinic-deploy, including the BEGIN and END lines."
          fi

          if [ -n "$HOSTKEY" ] && ! printf '%s' "$HOSTKEY" | grep -qE '(ssh-(rsa|ed25519)|ecdsa-sha2)'; then
            complain "DEPLOY_HOST_KEY does not look like a host key. Get it with: ssh-keyscan -H <droplet-ip>"
          fi

          if [ "$bad" = "1" ]; then
            {
              echo "### Deploy not configured"
              echo ""
              echo "The image **built and pushed successfully** -- only the deploy step is blocked."
              echo "All four \`DEPLOY_*\` secrets come from your server, so the droplet has to exist first."
              echo "See \`docs/WHERE-ENV-GOES.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All deploy secrets look well-formed."

      - name: Set up SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          HOSTKEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the host key. Without it this accepts whatever answers on
          # that address, so a DNS or routing compromise is handed the
          # deploy key and a shell on the box holding patient records.
          if [ -n "$HOSTKEY" ]; then
            printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_HOST_KEY is unset, so the server's identity is not verified. See docs/SETUP-WALKTHROUGH.md step 8."
            ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          TAG: ${{ github.event.inputs.tag || needs.build.outputs.image }}
          # A short-lived token so the server can pull a private image.
          # Scoped to read packages and expires with this job, which is
          # why no long-lived registry credential is stored on the box.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Deploying $TAG"
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" \
              -o BatchMode=yes -o ConnectTimeout=15 \
              "$USER@$HOST" \
              "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null \
               && IMAGE_TAG='$TAG' /srv/clinic/repo/deploy/deploy-image.sh \
               ; rc=\$?; docker logout ghcr.io >/dev/null 2>&1; exit \$rc"

      - name: Summary
        if: always()
        run: |
          echo "### Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ github.event.inputs.tag || needs.build.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
