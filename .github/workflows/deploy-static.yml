name: Deploy static apps

# clinic-web and provider-console are static bundles on Vercel.
#
# Why this rather than Vercel's own Git integration: Vercel deploys
# whatever you push, pass or fail. Here CI has to go green first, so a
# bundle that does not typecheck never reaches a clinic. The tradeoff is
# this file existing.
#
# clinic-web is ONE deployment serving every clinic through the wildcard,
# so this runs once per push, not once per clinic.

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/clinic-web/**'
      - 'apps/provider-console/**'
      - 'apps/nayaverse-web/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-static.yml'
  # So you can redeploy without an empty commit.
  workflow_dispatch:
    inputs:
      app:
        description: Which app to deploy
        type: choice
        options: [all, clinic-web, provider-console, nayaverse-web]
        default: all

concurrency:
  # A second push while the first is deploying cancels the first: the
  # older bundle was going to be overwritten anyway.
  group: deploy-static
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # Declared so that secrets scoped to this environment are visible.
    # A job with an environment reads BOTH repository secrets and that
    # environment's, so this works whichever way they were added --
    # without it, environment-scoped secrets are silently absent and
    # report as "not set", which is indistinguishable from never having
    # added them.
    environment: production
    strategy:
      # Independent projects, but kept serial so a failure is easy to read
      # in the log rather than interleaved.
      max-parallel: 1
      # Three separate Vercel projects. One failing must not cancel the
      # others: a broken check on clinic-web once cancelled nayaverse-web
      # before it deployed, which left a fix sitting unshipped.
      fail-fast: false
      matrix:
        include:
          - app: clinic-web
            project_id_secret: VERCEL_PROJECT_ID_CLINIC_WEB
            spa: true
          - app: provider-console
            project_id_secret: VERCEL_PROJECT_ID_PROVIDER_CONSOLE
            spa: true
          # Nayaverse's own site. Prerendered to real HTML per route rather
          # than an SPA, so it is checked differently below: the failure that
          # matters here is an empty <div id="root"> shipping to a search
          # engine, not a deep link falling through to the host's 404.
          - app: nayaverse-web
            project_id_secret: VERCEL_PROJECT_ID_NAYAVERSE_WEB
            spa: false

    steps:
      - uses: actions/checkout@v4

      - name: Should this app deploy?
        id: gate
        run: |
          choice="${{ github.event.inputs.app }}"
          if [ -z "$choice" ] || [ "$choice" = "all" ] || [ "$choice" = "both" ] || [ "$choice" = "${{ matrix.app }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.app }} (asked for $choice)"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      # Both apps are single-page apps: the server must return
      # index.html for any path it has no file for, or every URL except
      # "/" returns the host's own 404. That failure is invisible until
      # someone opens a link to anything but the home page -- /login was
      # how it surfaced here.
      - name: Check the SPA rewrite exists
        if: steps.gate.outputs.run == 'true' && matrix.spa
        working-directory: apps/${{ matrix.app }}
        run: |
          if [ ! -f vercel.json ]; then
            echo "::error::apps/${{ matrix.app }}/vercel.json is missing. Without a rewrite to /index.html, every deep link 404s."
            exit 1
          fi
          if ! grep -q '"/index.html"' vercel.json; then
            echo "::error::apps/${{ matrix.app }}/vercel.json has no rewrite to /index.html."
            exit 1
          fi
          echo "SPA rewrite present"

      - name: Build
        if: steps.gate.outputs.run == 'true'
        env:
          # clinic-web resolves its clinic at runtime from the hostname,
          # so these two are the only build-time values it needs. They are
          # vars, not secrets: both end up readable in the bundle, and
          # marking a public value secret only makes the logs useless.
          VITE_PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN }}
          VITE_PROVIDER_API_URL: ${{ vars.PROVIDER_API_URL }}
          VITE_API_URL: ${{ matrix.app == 'provider-console' && format('{0}/api/provider', vars.PROVIDER_API_URL) || '' }}
          # A served build must have a directory URL. CI builds to prove
          # the code compiles and sets this nowhere, so write-shell warns there.
          SEO_REQUIRE_DIRECTORY: "1"
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run --workspace "apps/${{ matrix.app }}" build

      # A prerender that silently produces an empty root still builds, still
      # returns 200, and is invisible until somebody notices the site has no
      # search traffic months later. The app's own build asserts its copy is
      # in the HTML; this re-asserts it against what is about to be uploaded.
      - name: Check the pages actually contain their content
        if: steps.gate.outputs.run == 'true' && !matrix.spa
        working-directory: apps/${{ matrix.app }}
        run: |
          fail=0
          for f in dist/index.html dist/pricing.html; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not produced -- the prerender did not run"
              fail=1
              continue
            fi
            bytes=$(wc -c < "$f")
            if [ "$bytes" -lt 12000 ]; then
              echo "::error::$f is only $bytes bytes -- it is a shell, not a page"
              fail=1
            fi
            grep -q '<title>' "$f" || { echo "::error::$f has no title"; fail=1; }
          done
          grep -q 'Sitemap:' dist/robots.txt || { echo "::error::robots.txt has no sitemap"; fail=1; }
          [ "$fail" = 0 ] && echo "pages carry their content"
          exit $fail

      - name: Deploy to Vercel
        id: vercel
        if: steps.gate.outputs.run == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
          # Same values the npm build used, so `vercel build` matches it.
          VITE_PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN }}
          VITE_PROVIDER_API_URL: ${{ vars.PROVIDER_API_URL }}
          VITE_API_URL: ${{ matrix.app == 'provider-console' && format('{0}/api/provider', vars.PROVIDER_API_URL) || '' }}
          SEO_REQUIRE_DIRECTORY: "1"
          # The same names read as variables, to tell "not set at all"
          # apart from "set in the wrong place".
          VAR_TOKEN: ${{ vars.VERCEL_TOKEN }}
          VAR_ORG: ${{ vars.VERCEL_ORG_ID }}
          VAR_PROJECT: ${{ vars[matrix.project_id_secret] }}
          VITE_BUILD_SHA: ${{ github.sha }}
        working-directory: apps/${{ matrix.app }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            if [ -n "$VAR_TOKEN" ] || [ -n "$VAR_PROJECT" ] || [ -n "$VAR_ORG" ]; then
              echo "::error::The Vercel credentials are set as VARIABLES, but are read as SECRETS."
              echo "::error::Settings > Secrets and variables > Actions > the SECRETS tab, as REPOSITORY secrets."
              echo "::error::Do not scope them to an Environment: this job declares none, so environment-scoped values never reach it."
              echo "::error::VERCEL_TOKEN as a variable is stored in the clear and is readable by anyone with repo access -- rotate it after moving."
              {
                echo "### Vercel credentials are in the wrong place"
                echo ""
                echo "Found as **Variables**; needed as **repository Secrets**."
                echo "A variable shows you its value, which is how you can tell them apart."
                echo ""
                echo "\`VERCEL_TOKEN\` stored as a variable should be rotated, not just moved."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Missing VERCEL_TOKEN or ${{ matrix.project_id_secret }}. See docs/WHERE-ENV-GOES.md."
            fi
            exit 1
          fi
          # `vercel build` re-runs the framework build under Vercel's own
          # environment, which does not have the variables this workflow
          # set -- so the npm build above is discarded and the values go
          # missing. Writing .env.production, which Vite reads natively,
          # is what makes the second build agree with the first.
          #
          # Without this the console shipped pointing at
          # http://localhost:4200 and failed in the browser with
          # ERR_CONNECTION_REFUSED, naming nothing useful.
          {
            echo "VITE_PLATFORM_DOMAIN=$VITE_PLATFORM_DOMAIN"
            echo "VITE_PROVIDER_API_URL=$VITE_PROVIDER_API_URL"
            echo "VITE_BUILD_SHA=$VITE_BUILD_SHA"
            [ -n "$VITE_API_URL" ] && echo "VITE_API_URL=$VITE_API_URL"
          } > .env.production
          echo "build-time environment:"
          sed 's/^/    /' .env.production

          npx --yes vercel@63 build --prod --token "$VERCEL_TOKEN" --yes

          # The URL is the last line vercel prints. Kept so the next step can
          # fetch the thing that was just deployed rather than trusting that
          # a clean build implies a working site.
          url="$(npx --yes vercel@63 deploy --prebuilt --prod --token "$VERCEL_TOKEN" --yes | tail -n1 | tr -d '\r')"
          echo "deployed to $url"
          case "$url" in
            https://*) echo "url=$url" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::Could not read a deployment URL from vercel; skipping the live check." ;;
          esac

      - name: Check the bundle was built with its configuration
        if: steps.gate.outputs.run == 'true'
        working-directory: apps/${{ matrix.app }}
        env:
          PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN }}
          PROVIDER_API_URL: ${{ vars.PROVIDER_API_URL }}
        run: |
          # Each app gets its API address a different way, so a correct
          # bundle looks different for each. An explicit arm per app, and a
          # default that fails: the previous version was an `else` holding
          # clinic-web's rules, so adding a third app silently enrolled it
          # in them and reported the failure under clinic-web's name.
          fail=0

          case "${{ matrix.app }}" in
          provider-console)
            # Build-time: VITE_API_URL is compiled in. A localhost URL
            # here means it was empty and the code fell back to its dev
            # default -- which in a browser is ERR_CONNECTION_REFUSED,
            # looking like the server is down.
            if grep -rqE 'localhost:(4100|4200)' dist/ 2>/dev/null; then
              echo "::error::provider-console still points at a localhost dev URL."
              echo "::error::PROVIDER_API_URL (a repository VARIABLE, not a secret) was empty at build time."
              grep -roE 'localhost:[0-9]+' dist/ | sort -u | sed 's/^/  /'
              fail=1
            fi
            if [ -n "$PROVIDER_API_URL" ] && ! grep -rqF "$PROVIDER_API_URL" dist/ 2>/dev/null; then
              echo "::error::provider-console does not contain $PROVIDER_API_URL."
              fail=1
            fi
            ;;

          clinic-web)
            # Runtime: clinic-web reads its own hostname and asks the
            # tenant directory which clinic's API to call, so one bundle
            # serves every clinic. VITE_API_URL is empty on purpose and
            # the localhost fallback in api.ts is dead code that
            # TenantGate overwrites before the first render.
            #
            # What must be present is the platform domain and the
            # directory URL. Without them the bundle cannot work out
            # which clinic it is, and every clinic site breaks at once.
            for needle in "$PLATFORM_DOMAIN" "$PROVIDER_API_URL"; do
              [ -z "$needle" ] && continue
              if ! grep -rqF "$needle" dist/ 2>/dev/null; then
                echo "::error::clinic-web does not contain '$needle'."
                echo "::error::Set PLATFORM_DOMAIN and PROVIDER_API_URL as repository VARIABLES."
                fail=1
              fi
            done
            if [ -z "$PLATFORM_DOMAIN" ] || [ -z "$PROVIDER_API_URL" ]; then
              echo "::error::PLATFORM_DOMAIN or PROVIDER_API_URL is unset. clinic-web cannot resolve clinics without them."
              fail=1
            fi
            ;;

          nayaverse-web)
            # Nayaverse's own site talks to no API at all: every page is
            # prerendered and the only outbound link a visitor follows is a
            # wa.me URL composed in the browser. So the check is the
            # opposite one -- nothing that looks like an API base, and
            # certainly no dev host, should have reached the bundle.
            if grep -rqE 'localhost:[0-9]+|127\.0\.0\.1' dist/assets/ 2>/dev/null; then
              echo "::error::nayaverse-web shipped a localhost URL."
              grep -roE 'localhost:[0-9]+|127\.0\.0\.1' dist/assets/ | sort -u | sed 's/^/  /'
              fail=1
            fi
            if [ -n "$PROVIDER_API_URL" ] && grep -rqF "$PROVIDER_API_URL" dist/assets/ 2>/dev/null; then
              echo "::error::nayaverse-web contains the provider API URL. It is a static site and should call nothing."
              fail=1
            fi
            ;;

          *)
            echo "::error::No configuration check defined for ${{ matrix.app }}."
            echo "::error::Add an arm to this case saying what a correct bundle looks like for it."
            echo "::error::Do not let it inherit another app's rules -- that is how a marketing"
            echo "::error::site ended up being required to contain a clinic API URL."
            fail=1
            ;;
          esac

          # The bundle is not the only thing shipped now. clinic-web's SEO
          # functions read a generated module, and if it was built without
          # a directory URL every page serves the generic head -- the
          # markup in the response is the entire feature, so that failure
          # is invisible from the outside. Checked here because the bundle
          # already is, and the functions deserve the same.
          if [ "${{ matrix.app }}" = "clinic-web" ]; then
            if [ ! -f api/_shell.js ]; then
              echo "::error::api/_shell.js was not generated. The SEO functions cannot serve a head."
              fail=1
            else
              if grep -q 'PROVIDER_API = ""' api/_shell.js; then
                echo "::error::The SEO functions have no directory URL, so every page would serve a generic head."
                echo "::error::PROVIDER_API_URL (a repository VARIABLE) was not visible to scripts/write-shell.mjs."
                fail=1
              fi
              if grep -q 'SHELL = ""' api/_shell.js; then
                echo "::error::api/_shell.js still holds the placeholder shell -- the build did not replace it."
                fail=1
              fi
              if ! grep -q '/assets/' api/_shell.js; then
                echo "::error::The inlined shell references no built assets, so the app would not boot from it."
                fail=1
              fi
            fi
          fi

          [ "$fail" = "0" ] && echo "${{ matrix.app }}: built with the right configuration"
          exit $fail

      # Everything above this line inspects the build. This fetches the
      # deployment. nayaverse-web shipped once with all nine pages built,
      # checked and correct, and two of its six routes serving 404 -- the
      # files were fine, the routing was not, and no build-time check can
      # see that difference.
      # Only nayaverse-web. The other two are multi-tenant: clinic-web
      # rewrites / to a function that resolves a clinic from the hostname,
      # and a bare *.vercel.app deployment URL is not a clinic, so there is
      # no path on it that is meaningfully "the site". Their equivalent
      # check is the real hostnames, which this workflow does not own.
      # Asks the PUBLIC address, not the *.vercel.app deployment URL: that
      # one carries Vercel's deployment protection, which answered 404 in
      # 107 bytes and redirected robots.txt to an SSO login, none of which
      # is a fact about this site.
      #
      # A public URL can answer 200 from an older deployment, or from a
      # different project, as this domain did until recently -- so every
      # page carries the commit it was built from, and this requires the
      # one being deployed. "The site is up" is not the claim; "this build
      # is up" is.
      - name: Ask the live site for its own pages
        if: >-
          steps.gate.outputs.run == 'true'
          && matrix.app == 'nayaverse-web'
        env:
          SITE: https://www.nayaverse.in
          SHA: ${{ github.sha }}
        run: |
          # Promotion to the domain is not instant.
          for attempt in 1 2 3 4 5 6 7 8; do
            live="$(curl -s --max-time 30 "$SITE/?cb=$RANDOM$attempt" || true)"
            case "$live" in
              *"$SHA"*) echo "live after ${attempt} attempt(s)"; break ;;
            esac
            if [ "$attempt" = 8 ]; then
              echo "::error::$SITE never served build $SHA."
              echo "::error::Found: $(printf '%s' "$live" | grep -o 'name=\"x-build\" content=\"[^\"]*\"' || echo 'no build stamp at all')"
              echo "::error::If another project still owns this domain, that is the cause."
              exit 1
            fi
            sleep 15
          done

          fail=0
          for p in / /pricing /hi /hi/pricing /mr /mr/pricing /robots.txt /sitemap.xml; do
            code="$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 "$SITE$p?cb=$RANDOM" || echo 000)"
            size="$(wc -c < /tmp/body | tr -d ' ')"
            printf '  %-16s %s  %s bytes\n' "$p" "$code" "$size"
            if [ "$code" != "200" ]; then
              echo "::error::$p returned $code."
              fail=1
            elif [ "${p%%.*}" = "$p" ] && [ "$size" -lt 2000 ]; then
              # A page that resolves but is nearly empty is the prerender
              # having silently not run.
              echo "::error::$p returned 200 but only $size bytes."
              fail=1
            fi
          done

          [ "$fail" = 0 ] && echo "every route answered, on build $SHA"
          exit $fail

      - name: Summary
        if: steps.gate.outputs.run == 'true'
        run: echo "Deployed **${{ matrix.app }}**" >> "$GITHUB_STEP_SUMMARY"
